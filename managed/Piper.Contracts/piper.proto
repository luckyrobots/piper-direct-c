syntax = "proto3";
package luckyrobots.piper.v1;
option csharp_namespace = "LuckyRobots.Piper.Grpc";

// Shares the existing hardware owner, leases, reported limits and obstruction monitor.
service PiperControl {
  rpc GetState(StateRequest) returns (StateFrame);
  rpc WatchState(StateRequest) returns (stream StateFrame);
  rpc Execute(ControlRequest) returns (ControlReply);
}
message StateRequest {}
message StateFrame {
  string json = 1;
  int64 sequence = 2;
  int64 timestamp_unix_microseconds = 3;
  string clock_domain = 4;
}
message ControlRequest {
  string route = 1;
  string json = 2;
}
message ControlReply {
  int32 status = 1;
  string json = 2;
}
